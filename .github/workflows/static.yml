# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch when the site content changes.
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/static.yml"
      - "index.html"
      - "privacy_policy.html"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Deliberately no `pull_request` trigger: this workflow holds write scopes and
# must only ever run on reviewed code that has landed on the default branch.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
    # Scoped to this job rather than the whole workflow so any job added later
    # does not silently inherit write access.
    permissions:
      contents: read # Read the site sources out of the repository.
      pages: write # Create the Pages deployment.
      id-token: write # Mint the OIDC token actions/deploy-pages trades for Pages credentials.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html privacy_policy.html _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
