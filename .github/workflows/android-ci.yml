name: Android CI

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/android-ci.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "app/**"
  # Always run on pull requests so required status checks are reported even when
  # this workflow file's path filters would otherwise skip the run. Individual
  # jobs decide internally whether to build or pass quickly.
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Android-related changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.detect.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        shell: bash
        run: |
          is_android_path() {
            case "$1" in
              .github/workflows/android-ci.yml|build.gradle.kts|settings.gradle.kts|gradle.properties|gradlew|gradlew.bat|gradle/*|app/*)
                return 0
                ;;
            esac
            return 1
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "android=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            mapfile -t changed_files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            before="${{ github.event.before }}"
            if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
              mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r HEAD)
            else
              mapfile -t changed_files < <(git diff --name-only "${before}" "${{ github.sha }}")
            fi
          fi

          android=false
          for file in "${changed_files[@]}"; do
            if is_android_path "${file}"; then
              android=true
              break
            fi
          done

          echo "android=${android}" >> "${GITHUB_OUTPUT}"

  build-and-test:
    name: Build, lint & unit test
    runs-on: ubuntu-latest
    needs: changes
    # This job executes build scripts and tests from pull requests, i.e.
    # untrusted code. Cap the runtime so an abusive PR cannot occupy a runner
    # for the full 6h default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Skip - no Android-related changes
        if: needs.changes.outputs.android != 'true'
        run: echo "No Android-related files changed; skipping build, lint, and unit tests."

      - name: Checkout
        if: needs.changes.outputs.android == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's credentials in .git/config, where the build
          # scripts running later in this job could read them.
          persist-credentials: false

      - name: Set up JDK 21
        if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Also validates gradle-wrapper.jar against Gradle's published checksums
      # (validate-wrappers defaults to true) before any Gradle code executes.
      - name: Setup Gradle
        if: needs.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        if: needs.changes.outputs.android == 'true'
        run: chmod +x gradlew

      - name: Run unit tests
        if: needs.changes.outputs.android == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        if: needs.changes.outputs.android == 'true'
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        if: needs.changes.outputs.android == 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        if: needs.changes.outputs.android == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload unit test results
        if: always() && needs.changes.outputs.android == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Upload lint report
        if: always() && needs.changes.outputs.android == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      # Artifacts of a public repo are downloadable by anyone. Only publish an
      # APK built from a reviewed commit on master, never one built from a
      # pull request, so the repo can't be used to host an attacker's build.
      - name: Upload debug APK
        if: success() && github.event_name != 'pull_request' && needs.changes.outputs.android == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  instrumented-test:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: [changes, build-and-test]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Skip - no Android-related changes
        if: needs.changes.outputs.android != 'true'
        run: echo "No Android-related files changed; skipping instrumented tests."

      - name: Checkout
        if: needs.changes.outputs.android == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        if: needs.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        if: needs.changes.outputs.android == 'true'
        run: chmod +x gradlew

      - name: Enable KVM group perms
        if: needs.changes.outputs.android == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        if: needs.changes.outputs.android == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test results
        if: always() && needs.changes.outputs.android == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected
          retention-days: 7
