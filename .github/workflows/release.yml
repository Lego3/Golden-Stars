name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug -PreleaseBuild=true --stacktrace

      - name: Prepare release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          if [ -f CHANGELOG.md ] && grep -q "^## \\[${VERSION}\\]" CHANGELOG.md; then
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > "${NOTES_FILE}"
          elif git tag -l --format='%(contents)' "${TAG}" | grep -q .; then
            git tag -l --format='%(contents)' "${TAG}" > "${NOTES_FILE}"
          else
            echo "Release ${TAG}" > "${NOTES_FILE}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.notes.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          shopt -s nullglob
          assets=(app/build/outputs/apk/debug/*.apk)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No debug APK found under app/build/outputs/apk/debug/"
            exit 1
          fi
          gh release create "${TAG}" \
            --title "Golden Stars ${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            "${assets[@]}"
